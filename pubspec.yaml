name: medlex
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.6+16

environment:
  sdk: '>=3.7.2 <4.0.0'
  flutter: '>=3.16.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  bloc: ^9.0.0
  cherry_toast: ^1.12.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  easy_localization: ^3.0.7+1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_rounded_progress_bar: ^0.3.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  get_it: ^8.0.3
  go_router: ^15.1.1
  internet_connection_checker: ^3.0.1
  json_annotation: ^4.9.0
  loader_overlay: ^5.0.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  dotted_border: ^3.1.0
  supabase_flutter: ^2.12.0
  flutter_launcher_icons: ^0.14.4
  photo_view: ^0.15.0
  fluttertoast: ^9.0.0
  flutter_tts: ^4.2.5
  cached_network_image: ^3.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  azlistview: ^2.0.0
  scrollable_positioned_list: ^0.2.3
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.0
  crypto: ^3.0.7
  google_mobile_ads: ^7.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  tutorial_coach_mark: ^1.2.11
  feedback: ^3.2.0
  flutter_email_sender: ^8.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2



dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.5

# path_provider_foundation >=2.5.0 moved to Dart native assets (pulls in
# `objective_c`), which this Flutter/Xcode setup fails to link on iOS/macOS:
# "Target native_assets required define SdkRoot but it was not provided".
# Pinned to the last pre-native-assets release until that's resolved upstream
# or the toolchain is updated. Remove once native assets work here.
dependency_overrides:
  path_provider_foundation: 2.4.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env
    

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 400